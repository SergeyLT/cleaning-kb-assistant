[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cleaning-kb"
version = "0.1.0"
description = "Помощник менеджера по базе знаний клининговой компании"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "SergeyLT"}]
dependencies = [
    "fastapi==0.165.0",
    "httpx==0.28.1",
    "haystack-ai==3.5.0",
    "jinja2==3.1.6",
    "tiktoken==0.14.0",
    "pydantic==2.14.4",
    "pydantic-settings==2.16.3",
    "starlette==1.10.0",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.6", "mypy==1.20.2", "httpx2==2.16.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cleaning_kb = ["migrations/*.sql", "templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".pytest_cache"
addopts = "--basetemp=.tmp/pytest"

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["ignore", ".tmp", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src"]
check_untyped_defs = true
disallow_incomplete_defs = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
pretty = false
show_error_codes = true
